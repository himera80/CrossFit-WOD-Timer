
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossFit WOD App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-background: #FFFFFF;
        --color-foreground: #000000;
        --color-primary: #58D289; /* The exact green from the screenshot */
        --color-primary-foreground: #FFFFFF;
        --color-secondary: #F3F4F6;
        --color-muted-foreground: #9CA3AF;
        --color-border: #F3F4F6;
        
        --font-sans: "DM Sans", sans-serif;
        --font-heading: "Montserrat", sans-serif;
      }

      body {
          font-family: "DM Sans", sans-serif;
          background-color: #F9FAFB;
          color: #000000;
          -webkit-tap-highlight-color: transparent;
      }
      
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Match the rounded container style from screenshot */
      .app-container {
        @apply bg-white rounded-[40px] shadow-2xl overflow-hidden relative border-[12px] border-black;
        height: 100%;
        max-height: 844px; /* iPhone 13 height roughly */
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react/": "https://esm.sh/react@^19.2.4/"
      }
    }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-zinc-900">
    <div id="root" class="w-full max-w-[390px] h-[844px]"></div>
</body>
</html>
