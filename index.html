
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossFit WOD App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#58D289',
              background: '#FFFFFF',
              foreground: '#000000',
              secondary: '#F3F4F6',
              muted: {
                foreground: '#9CA3AF'
              }
            },
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              heading: ["Montserrat", "sans-serif"],
            }
          }
        }
      }
    </script>
    <style type="text/css">
      body {
          font-family: "DM Sans", sans-serif;
          background-color: #F9FAFB;
          color: #000000;
          -webkit-tap-highlight-color: transparent;
      }
      
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Match the rounded container style from screenshot */
      .app-container {
        background-color: white;
        border-radius: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        position: relative;
        border: 12px solid black;
        height: 100%;
        max-height: 844px; /* iPhone 13 height roughly */
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react/": "https://esm.sh/react@^19.2.4/"
      }
    }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-zinc-900">
    <div id="root" class="w-full max-w-[390px] h-[844px]"></div>
</body>
</html>
